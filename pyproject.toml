[project]
name = "comissionaer"
version = "0.2.0"
description = "Comissionamento da FAB"
requires-python = ">=3.14"
dependencies = [
    "fpdf2>=2.8.7",
    "pdfplumber>=0.11.9",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "odfdo>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pyright>=1.1.409",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260408",
]

[project.scripts]
comissionaer = "comissionaer.__main__:main"

[tool.uv]
package = true

[tool.setuptools.package-data]
"comissionaer.data" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
